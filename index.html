<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیستی توخمەکان و تاقیکردنەوە</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #b82d16 0%, #ffffff 35%, #ffffff 65%, #005e30 100%);
            background-attachment: fixed;
            min-height: 100vh;
            direction: rtl;
            position: relative;
            overflow-x: hidden;
        }

        /* بۆکسی ناو نووسینی مۆدێرن (Modal) */
        #name-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 2px solid rgba(255, 204, 0, 0.6);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #111;
            font-size: 20px;
        }

        .modal-content input {
            width: 80%;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #ccc;
            outline: none;
            margin: 15px 0;
            text-align: center;
            transition: all 0.3s;
        }

        .modal-content input:focus {
            border-color: #007a3d;
            box-shadow: 0 0 10px rgba(0, 122, 61, 0.3);
        }

        .modal-btn {
            background: #007a3d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #005e30;
        }

        /* لۆگۆی گۆشەی ڕاستی سەرەوە بۆ دروستکەر و پلاتفۆرمەکان */
        .creator-badge {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            color: #ffcc00;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 204, 0, 0.5);
            z-index: 100;
            text-align: center;
        }

        .social-links {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .social-links a {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s;
            font-weight: bold;
        }

        .social-links a:hover {
            background: #ffcc00;
            color: #000;
        }

        /* خۆرەکەی ئاڵای کوردستان لە ناوەڕاستدا لە پشتەوە */
        .kurdish-sun {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.25) 0%, rgba(255, 204, 0, 0.05) 50%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        /* بەشی پەیامی نیشتمانی لە سەرەوە */
        .patriot-banner {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            color: #ffcc00;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 204, 0, 0.5);
        }

        .welcome-banner {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1, h2 {
            color: #111;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 25px;
            border-radius: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        #search-box {
            width: 100%;
            max-width: 500px;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            outline: none;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            direction: rtl;
            transition: all 0.3s ease;
        }
        #search-box:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        #details {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 500px;
            text-align: center;
            color: #000000;
            margin-bottom: 25px;
            display: none;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .category-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }

        .alkali { background-color: #D4A373 !important; color: #000; }
        .alkaline-earth { background-color: #E9D5A1 !important; color: #000; }
        .lanthanide { background-color: #A44A4A !important; color: #fff; }
        .actinide { background-color: #4A7BB0 !important; color: #fff; }
        .transition { background-color: #8C7A5B !important; color: #fff; }
        .other-transition { background-color: #A3C940 !important; color: #000; }
        .metalloid { background-color: #4CAF50 !important; color: #fff; }
        .halogen { background-color: #6B2346 !important; color: #fff; }
        .noble-gas { background-color: #4A2E6B !important; color: #fff; }
        .nonmetal { background-color: #2D6A68 !important; color: #fff; }

        #elements-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            direction: ltr;
        }
        .element-card {
            padding: 12px 8px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .element-card:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .element-card.selected {
            border: 4px solid #ffcc00 !important;
            transform: scale(1.12);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.9) !important;
            z-index: 10;
        }

        .el-num { font-size: 12px; font-weight: bold; align-self: flex-start; margin-left: 4px; }
        .el-symbol { font-size: 22px; font-weight: bold; margin: 2px 0; }
        .el-name-ku { font-size: 13px; font-weight: bold; }
        .el-name-en { font-size: 11px; opacity: 0.85; }

        .quiz-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-top: 20px;
            color: #000;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .quiz-inputs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .quiz-inputs input, .quiz-inputs select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .start-btn {
            background: #007a3d;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .start-btn:hover { background: #005e30; }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 6px 0;
            width: 100%;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #e9ecef; border-color: #bbb; }
        .action-btn {
            background: #d9381e;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .creator-badge {
                position: static;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- پەنجەرەی ناو نووسینی مۆدێرن -->
    <div id="name-modal">
        <div class="modal-content">
            <h3>بەخێربێیت بۆ ماڵپەڕەکە!</h3>
            <p style="font-size: 14px; color: #555;">تکایە ناوی خۆت بنووسە بۆ دەستپێکردن:</p>
            <input type="text" id="user-name-input" placeholder="ناوی خۆت..." autofocus>
            <br>
            <button class="modal-btn" onclick="saveUserName()">تۆمارکردن</button>
        </div>
    </div>

    <div class="creator-badge">
        دروست کراوە لە لایەن ئەلەند<br>
        <span style="font-size: 11px; opacity: 0.85;">Created by Aland</span>
        <div class="social-links">
            <a href="https://instagram.com/avear.avand" target="_blank">Instagram</a>
            <a href="https://tiktok.com/@snowboy.tiktokkkk" target="_blank">TikTok</a>
        </div>
    </div>

    <div class="kurdish-sun"></div>

    <div class="patriot-banner">☀️ ئامانجی ئێمە تەنها سەرکەوتنە، بژی کورد! ☀️</div>

    <div id="welcome" class="welcome-banner"></div>

    <h1>لیستی ١١٨ توخمی خشتەی خولی</h1>

    <input type="text" id="search-box" placeholder="گەڕان بەدوای ناوی کوردی، ئینگلیزی، هێما یان ژمارە..." onkeyup="filterElements()">

    <div id="details">
        <h2 id="det-title" style="margin: 0 0 10px 0; background: none; box-shadow: none; padding: 0;"></h2>
        <p id="det-num" style="margin: 5px 0;"></p>
        <p id="det-weight" style="margin: 5px 0;"></p>
        <div class="category-badge" id="det-cat"></div>
    </div>

    <div id="elements-list"></div>

    <div class="quiz-section">
        <h2>بەشی تاقیکردنەوە</h2>
        
        <div id="quiz-setup">
            <div class="quiz-inputs">
                <label>لە ژمارە: <input type="number" id="from-num" value="1" min="1" max="118" style="width: 60px;"></label>
                <label>تا ژمارە: <input type="number" id="to-num" value="20" min="1" max="118" style="width: 60px;"></label>
                <label>شێواز: 
                    <select id="quiz-mode">
                        <option value="mcq">هەڵبژاردن</option>
                        <option value="write">نووسین</option>
                    </select>
                </label>
            </div>
            <button class="start-btn" onclick="startQuiz()">دەستپێکردنی تاقیکردنەوە</button>
        </div>

        <div id="quiz-play" style="display: none;">
            <div id="question-text" style="font-size: 18px; font-weight: bold; margin-bottom: 15px;"></div>
            
            <div id="mcq-options" style="display: none;"></div>
            
            <div id="write-option" style="display: none;">
                <input type="text" id="write-input" placeholder="هێما و ژمارە بنووسە (نموونە: He 2)" style="padding: 10px; width: 80%; margin-bottom: 10px;">
                <br>
                <button class="start-btn" onclick="submitWriteAnswer()">ناردنی وەڵام</button>
            </div>

            <br>
            <button class="action-btn" onclick="skipQuestion()">تێپەڕاندن (Skip)</button>
        </div>

        <div id="quiz-results" style="display: none; text-align: right;">
            <h3>ئەنجامەکان:</h3>
            <p id="score-text" style="font-size: 18px; font-weight: bold;"></p>
            <div id="review-list" style="max-height: 250px; overflow-y: auto;"></div>
            <br>
            <button class="start-btn" onclick="resetQuiz()">تاقیکردنەوەیەکی تر</button>
        </div>
    </div>

    <script>
        let userName = "مێوان";

        function saveUserName() {
            let inputVal = document.getElementById('user-name-input').value.trim();
            if (inputVal !== "") {
                userName = inputVal;
            }
            document.getElementById('welcome').innerText = `بەخێربێیت، ${userName}!`;
            document.getElementById('name-modal').style.display = 'none';
        }

        // کارپێکردن بە دایرتەی Enter لە کیبۆرددا
        document.getElementById('user-name-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                saveUserName();
            }
        });

        function displayElements(items) {
            const listContainer = document.getElementById('elements-list');
            const details = document.getElementById('details');
            listContainer.innerHTML = '';

            items.forEach(elData => {
                const card = document.createElement('div');
                card.classList.add('element-card', elData.class);
                card.innerHTML = `
                    <div class="el-num">${elData.number}</div>
                    <div class="el-symbol">${elData.symbol}</div>
                    <div class="el-name-ku">${elData.name}</div>
                    <div class="el-name-en">${elData.nameEn}</div>
                `;
                
                card.onclick = () => {
                    document.querySelectorAll('.element-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');

                    details.style.display = 'block';
                    document.getElementById('det-title').innerText = `${elData.name} (${elData.nameEn} - ${elData.symbol})`;
                    document.getElementById('det-num').innerHTML = `<strong>ژمارەی گەردیلەیی:</strong> ${elData.number}`;
                    document.getElementById('det-weight').innerHTML = `<strong>کێشی گەردیلەیی:</strong> ${elData.weight}`;
                    
                    const catBadge = document.getElementById('det-cat');
                    catBadge.innerText = `زانیاری: ${elData.category}`;
                    catBadge.className = "category-badge " + elData.class;

                    details.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                };

                listContainer.appendChild(card);
            });
        }

        function filterElements() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const filtered = elements.filter(el => 
                el.name.toLowerCase().includes(query) ||
                el.nameEn.toLowerCase().includes(query) ||
                el.symbol.toLowerCase().includes(query) ||
                el.number.toString().includes(query)
            );
            displayElements(filtered);
        }

        displayElements(elements);

        /* لۆژیکی تاقیکردنەوە */
        let activeQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let quizMode = 'mcq';
        let userAnswers = [];

        function startQuiz() {
            let fromNum = parseInt(document.getElementById('from-num').value) || 1;
            let toNum = parseInt(document.getElementById('to-num').value) || 118;
            quizMode = document.getElementById('quiz-mode').value;

            if (fromNum > toNum || fromNum < 1 || toNum > 118) {
                alert("تکایە مەودایەکی دروست هەڵبژێرە (١ بۆ ١١٨)");
                return;
            }

            activeQuestions = elements.filter(el => el.number >= fromNum && el.number <= toNum);
            activeQuestions.sort(() => Math.random() - 0.5);

            currentIndex = 0;
            score = 0;
            userAnswers = [];

            document.getElementById('quiz-setup').style.display = 'none';
            document.getElementById('quiz-play').style.display = 'block';
            document.getElementById('quiz-results').style.display = 'none';

            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentIndex >= activeQuestions.length) {
                finishQuiz();
                return;
            }

            let q = activeQuestions[currentIndex];
            document.getElementById('question-text').innerText = 
                `پرسیاری ${currentIndex + 1} لە ${activeQuestions.length}: هێما و ژمارەی گەردیلەیی چییە بۆ (${q.name} - ${q.nameEn})؟`;

            if (quizMode === 'mcq') {
                document.getElementById('mcq-options').style.display = 'block';
                document.getElementById('write-option').style.display = 'none';

                let correctOpt = `${q.symbol} ${q.number}`;
                let options = [correctOpt];

                while (options.length < 4 && options.length < elements.length) {
                    let randEl = elements[Math.floor(Math.random() * elements.length)];
                    let randStr = `${randEl.symbol} ${randEl.number}`;
                    if (!options.includes(randStr)) {
                        options.push(randStr);
                    }
                }
                options.sort(() => Math.random() - 0.5);

                let optsDiv = document.getElementById('mcq-options');
                optsDiv.innerHTML = '';
                options.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.classList.add('option-btn');
                    btn.innerText = opt;
                    btn.onclick = () => answerQuiz(opt, correctOpt, q);
                    optsDiv.appendChild(btn);
                });
            } else {
                document.getElementById('mcq-options').style.display = 'none';
                document.getElementById('write-option').style.display = 'block';
                document.getElementById('write-input').value = '';
            }
        }

        function submitWriteAnswer() {
            let inputVal = document.getElementById('write-input').value.trim();
            let q = activeQuestions[currentIndex];
            let correctStr = `${q.symbol} ${q.number}`;
            answerQuiz(inputVal, correctStr, q);
        }

        function answerQuiz(userAns, correctAns, q) {
            let cleanUser = userAns.toLowerCase().replace(/\s+/g, '');
            let cleanCorrect = correctAns.toLowerCase().replace(/\s+/g, '');
            let isCorrect = (cleanUser === cleanCorrect);

            if (isCorrect) score++;

            userAnswers.push({
                question: `${q.name} (${q.nameEn})`,
                userAns: userAns || "هیچ",
                correctAns: correctAns,
                isCorrect: isCorrect
            });

            currentIndex++;
            loadQuizQuestion();
        }

        function skipQuestion() {
            let q = activeQuestions[currentIndex];
            userAnswers.push({
                question: `${q.name} (${q.nameEn})`,
                userAns: "تێپەڕێنراو (Skip)",
                correctAns: `${q.symbol} ${q.number}`,
                isCorrect: false
            });

            currentIndex++;
            loadQuizQuestion();
        }

        finishQuiz = function() {
            document.getElementById('quiz-play').style.display = 'none';
            document.getElementById('quiz-results').style.display = 'block';

            document.getElementById('score-text').innerText = `${userName}، نمرەکەت: ${score} لە ${activeQuestions.length}`;

            let reviewDiv = document.getElementById('review-list');
            reviewDiv.innerHTML = '<h4>پێداچوونەوە:</h4>';

            userAnswers.forEach((ans, idx) => {
                let color = ans.isCorrect ? '#007a3d' : '#d9381e';
                let status = ans.isCorrect ? '✓ ڕاستە' : '✗ هەڵەیە';
                reviewDiv.innerHTML += `
                    <div style="border-bottom: 1px solid #ddd; padding: 8px 0; text-align: right;">
                        <strong>${idx + 1}. ${ans.question}</strong><br>
                        وەڵامی تۆ: <span style="color:${color}; font-weight:bold;">${ans.userAns}</span> (${status})<br>
                        وەڵامی ڕاست: <strong>${ans.correctAns}</strong>
                    </div>
                `;
            });
        }

        function resetQuiz() {
            document.getElementById('quiz-setup').style.display = 'block';
            document.getElementById('quiz-results').style.display = 'none';
        }
    </script>
